# 3 台 ASUS 路由器 = 3 個 exporter container 實例(見 deploy/asus-exporter/
# README.md——一個實例只服務一台路由器),用這個 anchor 共用 build/restart
# 設定,避免 3 段複製貼上。
x-asus-exporter: &asus-exporter
  build: ./deploy/asus-exporter
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_edr
      POSTGRES_PASSWORD: mini_edr
      POSTGRES_DB: mini_edr
    ports:
      # host 端改成 5433,因為 NAS 上原生已有一個 postgres 佔用 5432(bind
      # 在 127.0.0.1)。container 內部還是 5432,backend 走 docker network
      # 內的 `db:5432` 連線,不受這裡影響;這個對外的 port 只是方便從 NAS
      # shell 用 psql debug 用。
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_edr -d mini_edr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 官方 compose 定義(https://github.com/Velocidex/velociraptor/tree/master/Docker),
  # 依 deploy/velociraptor/README.md 的步驟部署與首次啟動設定。
  velociraptor-server:
    image: ghcr.io/velocidex/velociraptor-server:latest
    restart: unless-stopped
    # 注意:docker compose 只會從「跟 docker-compose.yml 同層」的 .env 讀取
    # ${VAR} 變數代換,env_file 指到的檔案只會注入到 container 內部環境變數,
    # 不會拿來代換下面 ports 的埠號。所以 ports 這裡刻意寫死數字,
    # 若要改埠號,除了改 deploy/velociraptor/.env 也要一併改這裡。
    env_file:
      - ./deploy/velociraptor/.env
    ports:
      # Client(端點)連線埠與 GUI,需開放給內網 100 台端點與管理者存取,
      # 需與 deploy/velociraptor/.env 的 VELOCIRAPTOR_FRONTEND_PORT /
      # VELOCIRAPTOR_GUI_PORT 一致。
      - "8000:8000"
      - "8889:8889"
      # API(gRPC,預設 8001)刻意不對外發布,只給同一個 docker-compose
      # network 內的 backend 服務用(見 deploy/velociraptor/README.md 的
      # bind_address 調整說明)。
    volumes:
      - ./deploy/velociraptor/etc/:/etc/velociraptor/
      - ./deploy/velociraptor/datastore/:/datastore/

  # 沒有開 SNMP 服務的 ASUS 路由器,改用這個 vendor 進來的 exporter 模擬
  # 官方 App 登入路由器管理介面(見 deploy/asus-exporter/README.md)。不對
  # 外開 port,只給同 network 內的 backend 打;各自監聽容器內部固定的
  # 8000,靠 service name 互相區分,不衝突。新增第 4 台路由器的步驟見
  # deploy/asus-exporter/README.md。
  asus-exporter-1:
    <<: *asus-exporter
    env_file:
      - ./deploy/asus-exporter/router-1.env
  asus-exporter-2:
    <<: *asus-exporter
    env_file:
      - ./deploy/asus-exporter/router-2.env
  asus-exporter-3:
    <<: *asus-exporter
    env_file:
      - ./deploy/asus-exporter/router-3.env

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # docker network 內部用 service name 當 host,不是 .env 裡給本機
      # `uv run` 開發用的 localhost。
      DATABASE_URL: postgresql+psycopg://mini_edr:mini_edr@db:5432/mini_edr
      VELOCIRAPTOR_API_CONFIG_PATH: /velociraptor/api_client.yaml
      # app/core/config.py 的預設值 `../deploy/snmp/snmp_targets.json` 是給本機
      # `uv run`(cwd 是 backend/)用的相對路徑,容器裡的 cwd 是 /app,同一個
      # 相對路徑解析不到,一定要在這裡蓋成容器內實際掛載的絕對路徑——跟下面
      # VELOCIRAPTOR_API_CONFIG_PATH 蓋掉預設值的道理一樣。
      SNMP_TARGETS_CONFIG_PATH: /snmp/snmp_targets.json
      # 同上,蓋掉 app/core/config.py 給本機 `uv run` 用的相對路徑預設值。
      ASUS_EXPORTER_TARGETS_CONFIG_PATH: /asus_exporter/asus_targets.json
    volumes:
      # 見 deploy/velociraptor/README.md 第 6 節產生的 api_client.yaml,
      # 這個檔案不存在的話 backend 起得來但 Velociraptor 相關功能(資產同步、
      # 事件同步、隔離主機/砍進程)都會失敗。
      - ./deploy/velociraptor/etc/api_client.yaml:/velociraptor/api_client.yaml:ro
      # SNMP 監控目標清單(印表機/NAS/防火牆等,見 deploy/snmp/snmp_targets.example.json
      # 的格式範本)。這個檔案不存在的話 sync_snmp_assets 排程會直接
      # FileNotFoundError,但不影響其他功能。
      - ./deploy/snmp/snmp_targets.json:/snmp/snmp_targets.json:ro
      # ASUS exporter 目標清單(見 deploy/asus_exporter/asus_targets.example.json
      # 的格式範本)。這個檔案不存在的話 sync_asus_exporter_assets 排程會直接
      # FileNotFoundError,但不影響其他功能。
      - ./deploy/asus_exporter/asus_targets.json:/asus_exporter/asus_targets.json:ro
    ports:
      # 8000 已經被 velociraptor-server 的 client 連線埠佔用,backend 對外
      # 開 8080。
      - "8080:8000"
      # PA-410 syslog 掃描偵測用的 UDP 監聽埠(見 app/services/syslog_listener.py),
      # 要跟 PA-410 上 syslog server profile 設定的目的 port 一致、跟
      # SYSLOG_LISTEN_PORT(.env)一致。UDP,不是 TCP。
      - "5514:5514/udp"
    depends_on:
      db:
        condition: service_healthy
      # 純排序(等 container 開始跑),不是等 exporter 健康——exporter
      # 沒有內建 healthcheck,冷啟動時第一輪輪詢抓不到算正常的暫時性
      # ok=False,不該擋著 backend 不啟動。
      asus-exporter-1:
        condition: service_started
      asus-exporter-2:
        condition: service_started
      asus-exporter-3:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # Vite 是 build time 把這個值燒進靜態檔案,不是 runtime 讀環境變數
        # (見 frontend/Dockerfile 的說明)。這裡吃根目錄 .env 的
        # BACKEND_PUBLIC_URL,預設值只適合本機測試,部署到 NAS 要換成瀏覽器
        # 實際連得到的位址(NAS 的 IP 或內部 DNS 名稱),不是 container 內部
        # 的 service name。
        VITE_API_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
