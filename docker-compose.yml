services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mini_edr
      POSTGRES_PASSWORD: mini_edr
      POSTGRES_DB: mini_edr
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_edr -d mini_edr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 官方 compose 定義(https://github.com/Velocidex/velociraptor/tree/master/Docker),
  # 依 deploy/velociraptor/README.md 的步驟部署與首次啟動設定。
  velociraptor-server:
    image: ghcr.io/velocidex/velociraptor-server:latest
    restart: unless-stopped
    # 注意:docker compose 只會從「跟 docker-compose.yml 同層」的 .env 讀取
    # ${VAR} 變數代換,env_file 指到的檔案只會注入到 container 內部環境變數,
    # 不會拿來代換下面 ports 的埠號。所以 ports 這裡刻意寫死數字,
    # 若要改埠號,除了改 deploy/velociraptor/.env 也要一併改這裡。
    env_file:
      - ./deploy/velociraptor/.env
    ports:
      # Client(端點)連線埠與 GUI,需開放給內網 100 台端點與管理者存取,
      # 需與 deploy/velociraptor/.env 的 VELOCIRAPTOR_FRONTEND_PORT /
      # VELOCIRAPTOR_GUI_PORT 一致。
      - "8000:8000"
      - "8889:8889"
      # API(gRPC,預設 8001)刻意不對外發布,只給同一個 docker-compose
      # network 內的 backend 服務用(見 deploy/velociraptor/README.md 的
      # bind_address 調整說明)。
    volumes:
      - ./deploy/velociraptor/etc/:/etc/velociraptor/
      - ./deploy/velociraptor/datastore/:/datastore/

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # docker network 內部用 service name 當 host,不是 .env 裡給本機
      # `uv run` 開發用的 localhost。
      DATABASE_URL: postgresql+psycopg://mini_edr:mini_edr@db:5432/mini_edr
      VELOCIRAPTOR_API_CONFIG_PATH: /velociraptor/api_client.yaml
    volumes:
      # 見 deploy/velociraptor/README.md 第 6 節產生的 api_client.yaml,
      # 這個檔案不存在的話 backend 起得來但 Velociraptor 相關功能(資產同步、
      # 事件同步、隔離主機/砍進程)都會失敗。
      - ./deploy/velociraptor/etc/api_client.yaml:/velociraptor/api_client.yaml:ro
    ports:
      # 8000 已經被 velociraptor-server 的 client 連線埠佔用,backend 對外
      # 開 8080。
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Vite 是 build time 把這個值燒進靜態檔案,不是 runtime 讀環境變數
        # (見 frontend/Dockerfile 的說明)。這裡吃根目錄 .env 的
        # BACKEND_PUBLIC_URL,預設值只適合本機測試,部署到 NAS 要換成瀏覽器
        # 實際連得到的位址(NAS 的 IP 或內部 DNS 名稱),不是 container 內部
        # 的 service name。
        VITE_API_BASE_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
