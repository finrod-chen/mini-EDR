server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA:所有找不到對應檔案的路徑都導回 index.html,交給 react-router 處理,
    # 否則重新整理 /alerts 這類非根路徑會直接 404。
    #
    # 刻意不用 `$uri $uri/ /index.html`(常見 SPA 範本寫法):Vite build 輸出
    # 的靜態資源預設就放在 dist/assets/ 這個實體目錄,跟 react-router 的
    # /assets(資產管理頁面,見 frontend/src/App.tsx)路徑同名。加上 `$uri/`
    # 會讓 nginx 對 /assets 這個 request 命中 assets/ 目錄本身(當成
    # 「目錄」比對成功),目錄下沒有 index.html 又沒開 autoindex,結果是
    # 403 Forbidden,永遠不會 fallback 到 index.html 讓 react-router 接手
    # ——F5 重新整理 /assets 頁面必現此問題。SPA 場景本來就不需要「目錄」
    # fallback,只留 `$uri /index.html` 兩段:真正存在的檔案(含
    # /assets/index-xxxx.js 這類實際檔案路徑,一定精準命中 $uri)照常直接
    # 回應,其餘一律轉回 index.html。
    location / {
        try_files $uri /index.html;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
