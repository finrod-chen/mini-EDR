server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA:所有找不到對應檔案的路徑都導回 index.html,交給 react-router 處理,
    # 否則重新整理 /alerts 這類非根路徑會直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
